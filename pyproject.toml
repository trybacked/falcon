[project]
name = "falcon"
version = "0.1.0"
description = "Falcon — local UI shadowing recorder and LLM distillation pipeline."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "pillow>=10.0",
  "imagehash>=4.3",
  "httpx>=0.27",
  "pyyaml>=6.0",
]

# Platform capture backends (optional):
#   macOS:  uv sync --extra darwin   |  Windows: uv sync --extra win32
#   Either: ./scripts/build-native.sh
[project.optional-dependencies]
darwin = [
  "pyobjc-framework-Cocoa>=10.0",
  "pyobjc-framework-Quartz>=10.0",
  "pyobjc-framework-ApplicationServices>=10.0",
]
win32 = ["pywinauto>=0.6.8"]

[project.scripts]
falcon = "falcon.cli:main"

[dependency-groups]
dev = ["pytest>=8.0", "mypy>=1.0", "ruff>=0.8", "types-PyYAML>=6.0"]
build = ["pyinstaller>=6.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/falcon"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/falcon",
  "/config.toml.example",
  "/scripts/build-native.sh",
]

[tool.hatch.version]
path = "src/falcon/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["falcon"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[[tool.mypy.overrides]]
module = "falcon.capture.*"
ignore_errors = true

[tool.uv]
default-groups = ["dev"]
